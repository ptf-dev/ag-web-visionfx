<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkout — Paketa Premium + Gold EA Vision</title>
<meta name="robots" content="noindex" />
<style>
:root{
  --bg-0:#08070a;
  --bg-1:#0d0b0e;
  --ink:#f6efe0;
  --ink-dim:#b6ac97;
  --ink-mute:#7a7364;
  --gold:#e6b45a;
  --gold-hi:#f7dfa2;
  --ice:#a9c8ec;
  --line:rgba(230,180,90,.16);
  --line-strong:rgba(230,180,90,.38);
  --glass:rgba(22,19,17,.55);
  --ok:#7fd1a3;
  --bad:#e08b7a;
  --sans:"Manrope",ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;background:var(--bg-0);color:var(--ink);
  font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem 4rem;
}
.wrap{width:100%;max-width:520px}
.back{
  display:inline-block;margin-bottom:1.5rem;color:var(--ink-mute);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
}
.back:hover{color:var(--gold-hi)}

.summary{
  border:1px solid var(--line);border-radius:16px;background:var(--glass);
  padding:1.25rem;margin-bottom:1.5rem;display:flex;gap:1rem;align-items:center;
}
.summary img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.summary h1{margin:0 0 .25rem;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.summary .meta{font-size:.8rem;color:var(--ink-dim)}
.summary .price{margin-left:auto;font-family:var(--mono);font-size:1.15rem;color:var(--gold-hi);font-weight:600}

h2{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-mute);margin:0 0 .75rem;font-weight:500;
}

.methods{display:flex;gap:.5rem;margin-bottom:1.25rem}
.method{
  flex:1;padding:.7rem .5rem;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--ink-dim);cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  transition:all .22s cubic-bezier(.2,.7,.2,1);
}
.method:hover{border-color:var(--line-strong);color:var(--ink)}
.method[aria-selected="true"]{
  border-color:var(--line-strong);color:var(--gold-hi);background:rgba(230,180,90,.1);
}

.panel{display:none}
.panel.on{display:block}

.pay-btn{
  display:block;width:100%;text-align:center;text-decoration:none;cursor:pointer;
  padding:.95rem 1rem;border-radius:12px;border:1px solid var(--line-strong);
  background:linear-gradient(180deg,rgba(230,180,90,.16),rgba(230,180,90,.06));
  color:var(--gold-hi);font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:500;transition:all .22s cubic-bezier(.2,.7,.2,1);
}
.pay-btn:hover{background:rgba(230,180,90,.2)}
.pay-btn[disabled]{opacity:.45;cursor:not-allowed}

.hint{margin-top:.75rem;font-size:.78rem;color:var(--ink-mute)}
#pok-form{margin-top:1rem}
#pok-form:empty{margin-top:0}

.note{
  margin-top:1rem;padding:.8rem .9rem;border-radius:11px;font-size:.82rem;
  border:1px solid var(--line);background:rgba(230,180,90,.05);color:var(--ink-dim);
}
.note.err{border-color:rgba(224,139,122,.4);background:rgba(224,139,122,.08);color:var(--bad)}
.note.ok{border-color:rgba(127,209,163,.4);background:rgba(127,209,163,.08);color:var(--ok)}
.note[hidden]{display:none}

.secure{
  margin-top:1.5rem;text-align:center;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);
}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">&larr; Back</a>

  <div class="summary">
    <img src="images/pdin7k86farf9pnex92lt5x1jjo.png" alt="" />
    <div>
      <h1>Paketa Premium + Gold EA Vision</h1>
      <div class="meta">Lifetime access</div>
    </div>
    <div class="price">&euro;350</div>
  </div>

  <h2>Payment method</h2>
  <div class="methods" role="tablist">
    <button class="method" role="tab" aria-selected="true"  data-panel="paypal">PayPal</button>
    <button class="method" role="tab" aria-selected="false" data-panel="pok">Card &middot; Pok</button>
  </div>

  <section class="panel on" id="panel-paypal">
    <a class="pay-btn" href="https://www.paypal.com/ncp/payment/J4CL6SY9AAH9Y" target="_blank" rel="noopener">
      Continue with PayPal
    </a>
    <p class="hint">You'll finish the payment on PayPal's secure page, then return here.</p>
  </section>

  <section class="panel" id="panel-pok">
    <button class="pay-btn" id="pok-start">Pay by card</button>
    <div id="pok-form"></div>
    <p class="note" id="pok-note" hidden></p>
  </section>

  <p class="secure">Payments handled by PayPal and Pok &middot; cards never touch this server</p>

</div>

<script src="https://static.pokpay.io/public/dist/pokpayments/pok-payment.js"></script>
<script>
(function () {
  /* ----------------------------------------------------------------
     Point this at the deployed Cloudflare Worker (see pok/README.md).
     While it is empty the Pok option stays disabled and PayPal — which
     works today — is untouched.
  ---------------------------------------------------------------- */
  var WORKER_URL = '';
  var POK_ENV    = 'staging';   // flip to 'production' with production keys
  var POK_LOCALE = 'al';

  var tabs  = document.querySelectorAll('.method');
  var note  = document.getElementById('pok-note');
  var start = document.getElementById('pok-start');
  var mount = document.getElementById('pok-form');

  function say(msg, kind) {
    note.textContent = msg;
    note.className = 'note' + (kind ? ' ' + kind : '');
    note.hidden = false;
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t === tab)); });
      document.querySelectorAll('.panel').forEach(function (p) {
        p.classList.toggle('on', p.id === 'panel-' + tab.dataset.panel);
      });
    });
  });

  if (!WORKER_URL) {
    start.disabled = true;
    say('Card payment is not switched on yet. Use PayPal above.');
    return;
  }

  start.addEventListener('click', async function () {
    start.disabled = true;
    say('Preparing secure form…');

    try {
      // The amount is decided by the Worker, never sent from here.
      var res = await fetch(WORKER_URL + '/api/pok/order', { method: 'POST' });
      if (!res.ok) throw new Error('order');
      var orderId = (await res.json()).orderId;
      if (!orderId) throw new Error('order');

      note.hidden = true;
      start.style.display = 'none';

      PokPayment.renderForm(
        'pok-form',
        orderId,
        async function onSuccess() {
          // Don't trust the callback alone — ask the Worker what the order
          // actually says before telling anyone they've paid.
          try {
            var check = await fetch(WORKER_URL + '/api/pok/order/' + orderId);
            var order = await check.json();
            var paid = order && (order.capturedAmount > 0 || /paid|captur|success|complete/i.test(order.status || ''));
            if (!paid) throw new Error('unconfirmed');
          } catch (e) {
            say('Payment sent, but we could not confirm it yet. Please contact us before paying again.', 'err');
            return;
          }
          mount.innerHTML = '';
          say('Payment received. Check your email for the licence key and EA file.', 'ok');
        },
        function onError() {
          say('That payment did not go through. Try again, or use PayPal.', 'err');
          start.style.display = '';
          start.disabled = false;
        },
        { env: POK_ENV, locale: POK_LOCALE }
      );
    } catch (e) {
      say('Could not start the card payment. Please use PayPal above.', 'err');
      start.disabled = false;
    }
  });
})();
</script>
</body>
</html>
